[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "isales-scheduler"
version = "0.1.0"
description = "Lead dispatch scheduler for the iSales platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "iSales" }]
dependencies = [
    "isales-common>=0.2.0,<0.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres]>=4.0",
    "ruff>=0.3",
    "mypy>=1.8",
    "types-redis",
]

[project.scripts]
isales-scheduler = "isales_scheduler.main:run"

[tool.hatch.build.targets.wheel]
packages = ["isales_scheduler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "C4",
    "ASYNC",
    "SIM",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
